# Render blueprint: one web service serves the API (SSE, polling engines, SQLite) and the built frontend.
services:
  - type: web
    name: panoptes
    runtime: node
    plan: free # free sleeps after ~15 min idle; use "starter" to keep it warm for a demo
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      # Case file lives on the instance disk and is wiped on redeploy. Attach a disk
      # (paid plans) and point PANOPTES_DB at it to keep cases, e.g. /var/data/panoptes.db
      # Secrets: values are set in the Render dashboard only (sync: false = never in git).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ACLED_EMAIL
        sync: false
      - key: ACLED_PASSWORD
        sync: false
      - key: FIRMS_MAP_KEY
        sync: false
      - key: CLOUDFLARE_RADAR_TOKEN
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GOOGLE_FACTCHECK_API_KEY
        sync: false
